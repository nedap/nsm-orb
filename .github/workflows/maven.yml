name: Build with Maven

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'GitHub runner'
        default: 'ubuntu-latest'
        required: false
        type: string
      java-version:
        description: 'The Java version to set up.'
        default: '17'
        required: false
        type: string
      maven-version:
        description: 'The Maven version to set up.'
        default: ''
        required: false
        type: string
      toolchains:
        description: 'Use Maven toolchains plugin'
        default: false
        required: false
        type: boolean
      git-ref:
        description: 'The github ref that should be checked out.'
        default: ${{ github.ref }}
        required: false
        type: string
      junit-files:
        description: 'File patterns of JUnit XML'
        default: '**/target/surefire-reports/*.xml'
        required: false
        type: string
      upload-artifacts:
        description: 'Upload Java Packages'
        default: true
        required: false
        type: boolean
      retention-days-artifact:
        description: 'Duration after which artifact will expire in days. 0 means using default retention.'
        default: '1'
        required: false
        type: string
      retention-days-test-results:
        description: 'Duration after which test results will expire in days. 0 means using default retention.'
        default: '7'
        required: false
        type: string
      enable-sonar:
        type: boolean
        description: 'Enable Sonar configuration for this build?, requires the coverage and sonar profiles to be set in the main pom.xml'
        required: false
        default: false
      args:
        description: 'Arguments like -DskipTests -pl testbom,threads -am'
        default: ''
        required: false
        type: string
      skip-tests:
        description: 'Skip tests execution'
        default: false
        required: false
        type: boolean
      deploy:
        description: 'Deploy artifact(s) to repository'
        default: false
        required: false
        type: boolean
      maven-lifecycle:
        description: 'set the maven lifecycle, this will overwrite the deploy setting'
        default: ''
        required: false
        type: string
      defaultdeploymentrepository:
        description: 'Use default alternative repository'
        default: true
        required: false
        type: boolean
      debug:
        description: 'Enable debug log'
        default: false
        required: false
        type: boolean
      working-subdirectory:
        description: 'Specify an alternative subdirectory as working directory for the task.'
        type: string
        required: false
        default: '.'
      artifact-name:
        description: 'Name of artifact'
        type: string
        required: false
        default: ''
      artifact-path:
        description: 'Destination location of artifact'
        type: string
        required: false
        default: ''
      xvfb:
        description: 'Use X Virtual Framebuffer'
        default: false
        required: false
        type: boolean
      cache-key:
        description: 'explicit key for a cache entry'
        default: ''
        required: false
        type: string
      cache-path:
        description: 'list of files, directories, and wildcard patterns to cache'
        default: ''
        required: false
        type: string
      name-postfix:
        description: 'optional postfix for name'
        default: ''
        required: false
        type: string
      pre-run:
        description: 'run command executed before Maven'
        default: ''
        required: false
        type: string

    secrets:
      SECURITY_GITHUB_USERNAME:
        required: true
        description: The username of the GitHub user to connect to GitHub Packages.
      SECURITY_GITHUB_PACKAGES_WRITE:
        required: true
        description: The Private Access Token (PAT) to publish to GitHub Packages.

jobs:
  build-maven:
    runs-on: ${{ inputs.runs-on }}
    env:
      TZ: Europe/Amsterdam
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git-ref }}

      - name: Download artifact
        if: ${{ inputs.artifact-name != '' && inputs.artifact-path != '' }}
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}

      - name: Set up JDK 8 for toolchains.xml
        if: ${{ inputs.toolchains }}
        id: jdk8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Create toolchains.xml for JDK 8
        if: ${{ inputs.toolchains }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/toolchains.xml <<EOF
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>1.8</version>
                <vendor>adoptium</vendor>
              </provides>
              <configuration>
                <jdkHome>${{ steps.jdk8.outputs.path }}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF

      - name: Set up JDK ${{ inputs.java-version }} (with default Maven cache)
        if: ${{ inputs.cache-key == '' || inputs.cache-path == '' }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Set up JDK ${{ inputs.java-version }} (with no cache)
        if: ${{ inputs.cache-key != '' && inputs.cache-path != '' }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - name: Prepare per-run cache
        if: ${{ inputs.cache-key != '' && inputs.cache-path != '' }}
        uses: actions/cache@v5
        with:
          key: ${{ inputs.cache-key }}
          path: ${{ inputs.cache-path }}

      - name: Setup Maven
        if: ${{ inputs.maven-version != '' }}
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: ${{ inputs.maven-version }}

      - name: Add Github repository to settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">

            <servers>
              <server>
                <id>github-nedap</id>
                <username>\${GITHUB_PACKAGES_USERNAME}</username>
                <password>\${GITHUB_PACKAGES_TOKEN}</password>
              </server>
            </servers>

          </settings>
          EOF

      - name: Determine BUILD INFO OPTS
        id: build-opts
        uses: 'nedap/nsm-orb/.github/actions/build-info-opts@nedap/main'
        with:
          build-tool: 'maven'
          enable-sonar: ${{ inputs.enable-sonar }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup X Virtual Framebuffer
        if: ${{ inputs.xvfb }}
        run: |
          command -v Xvfb || (sudo apt-get update && sudo apt-get install -y xvfb)
          Xvfb :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Fetch history for maven-git-versioning-extension
        run: |
          if [ -f  ${{ inputs.working-subdirectory }}/.mvn/maven-git-versioning-extension.xml ]; then
            git fetch --unshallow
          fi

      - name: Set Maven lifecycle
        run: |
          if [ "${{ inputs.maven-lifecycle == '' }}" == "true" ]; then
            if [ "${{ inputs.deploy || github.ref_name == 'main' || startsWith(github.ref_name, 'branch_release') || startsWith(github.ref, 'refs/tags/') }}" == "true" ]; then
              MAVEN_LIFECYCLE=deploy
            else
              MAVEN_LIFECYCLE=install
            fi
          else
            MAVEN_LIFECYCLE=${{ inputs.maven-lifecycle }}
          fi
          echo "MAVEN_LIFECYCLE=${MAVEN_LIFECYCLE}" >> $GITHUB_ENV

      - name: Build with Maven (${{ env.MAVEN_LIFECYCLE }})
        run: |
          ${{ inputs.pre-run }}
          mvn --batch-mode --errors --show-version --no-transfer-progress \
          ${{ env.MAVEN_LIFECYCLE }} \
          ${{ steps.build-opts.outputs.build-info }} \
          ${{ inputs.args }} \
          ${{ inputs.defaultdeploymentrepository && format('-DaltDeploymentRepository=github-nedap::default::https://maven.pkg.github.com/nedap/{0}', github.event.repository.name) || '' }} \
          ${{ inputs.debug && '--debug' || '' }} \
          ${{ inputs.skip-tests && '-DskipTests' || '' }} \
          --file ${{ inputs.working-subdirectory }}/pom.xml
        env:
          GITHUB_PACKAGES_USERNAME: ${{ secrets.SECURITY_GITHUB_USERNAME }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.SECURITY_GITHUB_PACKAGES_WRITE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SECURITY_SONAR_TOKEN }}

      - name: Publish Unit Test Results (in Run summary)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ always() && !(inputs.skip-tests) && !(github.actor == 'dependabot[bot]' ||
          (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]') ||
           startsWith((github.head_ref || github.ref_name), 'dependabot/')) }}
        with:
          files: ${{ inputs.junit-files }}
          check_name: "Unit Test Results${{ inputs.name-postfix }}"

      - name: Upload Unit Test Results (as artifact)
        uses: actions/upload-artifact@v6
        if: ${{ always() && !(inputs.skip-tests) }}
        with:
          name: ${{ github.event.repository.name }}-unit-tests${{ inputs.name-postfix }}
          path: ${{ inputs.junit-files }}
          retention-days: ${{ inputs.retention-days-test-results }}
          if-no-files-found: warn

      - name: Upload Java Packages
        uses: actions/upload-artifact@v6
        if: ${{ inputs.upload-artifacts }}
        with:
          name: ${{ github.event.repository.name }}${{ inputs.name-postfix }}
          path: |
            **/target/extra-libs/*.jar
            **/target/*.jar
            **/target/*.war
          retention-days: ${{ inputs.retention-days-artifact }}
          if-no-files-found: error

      - name: Update summary to include the version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout --file ${{ inputs.working-subdirectory }}/pom.xml)
          cat > $GITHUB_STEP_SUMMARY << EOF
          ### Maven build
          Project version: $VERSION
          EOF
